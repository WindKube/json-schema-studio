services:
  app:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
      - wrangler_config:/root/.config/.wrangler
    environment:
      npm_config_store_dir: /pnpm/store
    ports:
      - "5173:5173"
      - "4173:4173"
    command: sh -c "pnpm migrate && pnpm dev --host 0.0.0.0"

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    environment:
      npm_config_store_dir: /pnpm/store
      CI: "true"
    command: sh -c "corepack enable && pnpm e2e"

volumes:
  node_modules:
  pnpm_store:
  wrangler_config:
